Syntax 2

SectionUseCase."HiFi" {
#File "../MNT/reform2/fsl/HiFi.conf"
  File "HiFi.conf"
  Comment "MNT Reform Hi-Fi Audio"
}

BootSequence [
	# Zero-crossing detection avoids popping while changing volume
	cset "name='Headphone Playback ZC Switch' on"
	cset "name='Capture Volume ZC Switch' on"
	cset "name='Speaker Playback ZC Switch' on"
	# Disable bypass output mixers to prevent feedback when mic is plugged in
	cset "name='Left Output Mixer Boost Bypass Switch' off"
	cset "name='Left Output Mixer Boost Bypass Volume' 0"
	cset "name='Right Output Mixer Boost Bypass Switch' off"
	cset "name='Right Output Mixer Boost Bypass Volume' 0"
	# Default 3D effect to off
	cset "name='3D Switch' off"
	cset "name='3D Volume' 0"
	cset "name='3D Filter Lower Cut-Off' 0"
	cset "name='3D Filter Upper Cut-Off' 0"
	cset "name='PCM Playback -6dB Switch' off"
	# Default mic ALC & gate to off
	cset "name='ALC Function' 0"
	cset "name='ALC Mode' 0"
	cset "name='ALC Attack' 0"
	cset "name='ALC Decay' 0"
	cset "name='ALC Hold Time' 0"
	cset "name='ALC Max Gain' 0"
	cset "name='ALC Min Gain' 0"
	cset "name='ALC Target' 0"
	cset "name='Noise Gate Switch' off"
	cset "name='Noise Gate Threshold' 0"
	# Default EQ-like things off
	cset "name='ADC High Pass Filter Switch' off"
	cset "name='DAC Deemphasis Switch' off"
	cset "name='DAC Filter Characteristics' 0"
	# Default polarity
	cset "name='DAC Polarity' 0"
	cset "name='ADC Polarity' 0"
	# Reasonable defaults for volume
	cset "name='ADC PCM Capture Volume' 195" # +0dB
	cset "name='Speaker Playback Volume' 127"
	# Connect PCM outputs
	cset "name='Left Output Mixer PCM Playback Switch' on"
	cset "name='Right Output Mixer PCM Playback Switch' on"

]

FixedBootSequence [
	# Avoid connecting RINPUT3/LINPUT3 these are wired to switches.
	cset "name='Left Boost Mixer LINPUT3 Switch' off"
	cset "name='Left Input Boost Mixer LINPUT3 Volume' 0"
	cset "name='Right Boost Mixer RINPUT3 Switch' off"
	cset "name='Right Input Boost Mixer RINPUT3 Volume' 0"
	cset "name='Left Output Mixer LINPUT3 Switch' off"
	cset "name='Left Output Mixer LINPUT3 Volume' 0"
	cset "name='Right Output Mixer RINPUT3 Switch' off"
	cset "name='Right Output Mixer RINPUT3 Volume' 0"
]


