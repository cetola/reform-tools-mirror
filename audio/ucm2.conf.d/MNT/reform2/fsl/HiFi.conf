SectionVerb."HiFi" {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		# Connect DAC to outputs
		cset "name='Left Output Mixer PCM Playback Switch' on"
		cset "name='Right Output Mixer PCM Playback Switch' on"
	]
}

SectionDevice."Headphone" {
	Comment "Headphone Jack"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Headphone Playback Volume' 127"
	]
	
	DisableSequence [
		cset "name='Headphone Playback Volume' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Playback"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speakers"

	ConflictingDevice [
		"Headphone"
	]

	EnableSequence [
		cset "name='Speaker Playback Volume' 127"
	]
	
	DisableSequence [
		cset "name='Speaker Playback Volume' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId}"
		PlaybackMixerElem "Playback"
	}
}

SectionDevice."HeadsetMic" {
	Comment "Headphone Jack Microphone"
	
	ConflictingDevice [
		"Line"
	]

	EnableSequence [
		# Mic is mono, so send the left data to both channels
		cset "name='Left Input Mixer Boost Switch' on"
		cset "name='Left Boost Mixer LINPUT1 Switch' on"
		cset "name='ADC Data Output Select' 1"
	]

	DisableSequence [
		cset "name='Left Input Mixer Boost Switch' off"
		cset "name='Left Boost Mixer LINPUT1 Switch' off"
	]

	Value {
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "Capture"
	}
}

SectionDevice."Line" {
	Comment "Line In Header"

	ConflictingDevice [
		"HeadsetMic"
	]

	EnableSequence [
		cset "name='Left Input Mixer Boost Switch' on"
		cset "name='Right Input Mixer Boost Switch' on"
		cset "name='Left Boost Mixer LINPUT2 Switch' on"
		cset "name='Right Boost Mixer RINPUT2 Switch' on"
		cset "name='ADC Data Output Select' 0"
	]

	DisableSequence [
		cset "name='Left Input Mixer Boost Switch' off"
		cset "name='Right Input Mixer Boost Switch' off"
		cset "name='Left Boost Mixer LINPUT2 Switch' off"
		cset "name='Right Boost Mixer RINPUT2 Switch' off"
	]

	Value {
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "Capture"
	}
}
