Include.rxminit.File "/codecs/qcom-lpass/rx-macro/init.conf"

SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='HP Driver Playback Switch' off"
		cset "name='HP Left Switch' off"
		cset "name='HP Right Switch' off"

		cset "name='Speaker Driver Playback Switch' on"

		cset "name='DAC Left Input' Mono"
		cset "name='DAC Right Input' off"
		cset "name='Output Left From Left DAC' on"
		cset "name='Output Right From Right DAC' off"
		cset "name='DAC Playback Volume' 127"
		cset "name='HP Driver Playback Volume' 0"
		cset "name='HP Analog Playback Volume' 127"
		cset "name='Speaker Analog Playback Volume' 127"
		cset "name='Speaker Driver Playback Volume' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
	]

}

SectionDevice."Speaker" {
	Comment "Speaker"

	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	EnableSequence [
		cset "name='HP Left Switch' off"
		cset "name='HP Right Switch' off"
		cset "name='Speaker Driver Playback Switch' on"
		cset "name='DAC Left Input' Mono"
		cset "name='DAC Right Input' off"
		cset "name='Output Left From Left DAC' on"
		cset "name='Output Right From Right DAC' off"
	]

	DisableSequence [
		cset "name='Speaker Driver Playback Switch' off"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Include.rxmhpe2.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd2.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	EnableSequence [
		cset "name='Speaker Driver Playback Switch' off"
		cset "name='HP Left Switch' on"
		cset "name='HP Right Switch' on"
		cset "name='DAC Left Input' 'Left Data'"
		cset "name='DAC Right Input' 'Right Data'"
		cset "name='Output Left From Left DAC' on"
		cset "name='Output Right From Right DAC' on"
		cset "name='HP Driver Playback Switch' on"
	]

	DisableSequence [
		cset "name='HP Left Switch' off"
		cset "name='HP Right Switch' off"
		cset "name='HP Driver Playback Switch' off"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

